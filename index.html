<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<title>GVG — GENVIGUE · Build. Create. Own.</title>
<!--
  GVG — GENVIGUE  ·  Phase 1 frontend prototype (single file).
  PHASE 1 DEMO ONLY — REPLACE WITH SERVER-SIDE AUTH IN PHASE 2.
  Authentication is connected to Supabase. DYX, orders and admin operations still require secure server-side Phase 2 endpoints.
-->
<style>
:root{
  --obs:#0B0B0D;--gra:#17171C;--gra2:#1E1E25;--gold:#C9A86A;--soft:#F1D79B;--ivory:#F5F2EA;--mut:#96939A;
  --line:rgba(201,168,106,.2);--line2:rgba(245,242,234,.09);
  --danger:#E5736B;--ok:#7FC8A0;--warn:#E8B75D;--nav-h:64px;--r:18px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--obs);color:var(--ivory);font:15px/1.55 var(--sans);min-height:100vh;min-height:100dvh;
  background-image:radial-gradient(900px 420px at 50% -140px,rgba(201,168,106,.09),transparent 70%);background-repeat:no-repeat;overflow-wrap:anywhere}
body.lock{overflow:hidden}
img,svg{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
h1,h2,h3,h4{font-weight:600;line-height:1.2}
.serif{font-family:var(--serif)}
:focus-visible{outline:2px solid var(--soft);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.muted{color:var(--mut)}
.u{font-size:.62em;letter-spacing:.14em;color:var(--gold);font-weight:700;margin-left:3px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:grid;gap:12px}
.gap{gap:10px}.mt{margin-top:16px}.mt2{margin-top:26px}.mb{margin-bottom:16px}.center{text-align:center}

/* topbar */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,11,13,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:1100px;margin:0 auto;height:56px;padding:0 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.16em;font-size:14px;flex:none}
.brand img{width:32px;height:32px;border-radius:50%}
.ptitle{flex:1;min-width:0;text-align:center;font-size:12px;letter-spacing:.16em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-width:40px;height:40px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--gra);position:relative;font-size:13px;flex:none;transition:border-color .2s}
.tbtn:hover{border-color:var(--gold)}
.tbtn svg{width:19px;height:19px}
.badge-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#17120a;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.badge-n.bump{animation:bump .45s}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#17120a;font-weight:700;display:grid;place-items:center;font-size:13px}
.page{max-width:1100px;margin:0 auto;padding:18px 14px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));animation:pageIn .3s ease both;min-width:0}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.bottomnav-in{pointer-events:auto;width:100%;max-width:640px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(23,23,28,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;color:var(--mut);font-size:10.5px;letter-spacing:.08em;font-weight:600;border-radius:12px;transition:color .2s}
.nav-item svg{width:22px;height:22px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.nav-item::before{content:"";position:absolute;top:-7px;left:50%;width:0;height:2px;background:var(--gold);border-radius:2px;transform:translateX(-50%);transition:width .3s}
.nav-item:hover{color:var(--ivory)}
.nav-item.active{color:var(--soft)}
.nav-item.active::before{width:28px}
.nav-item.active svg{transform:translateY(-2px) scale(1.1)}
@media(min-width:900px){.bottomnav{bottom:14px}.bottomnav-in{border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 40px -12px rgba(0,0,0,.8);padding-bottom:6px;max-width:560px}.page{padding-bottom:120px}}

/* basics */
.card{background:var(--gra);border:1px solid var(--line2);border-radius:var(--r);padding:16px;min-width:0}
.card.gold{border-color:var(--line)}
.hover{transition:transform .2s,border-color .2s}.hover:hover{transform:translateY(-2px);border-color:var(--line)}
.h1{font-size:clamp(26px,6vw,36px);margin-bottom:14px;letter-spacing:.02em}
.h2{font-size:clamp(20px,4.6vw,26px)}
.lead{font-size:clamp(15px,3.8vw,17px);color:#cfcac0;max-width:46ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .15s,background .2s,border-color .2s,opacity .2s,color .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-gold{background:var(--gold);color:#17120a}.btn-gold:hover{background:var(--soft)}
.btn-ghost{border-color:var(--line);color:var(--ivory);background:rgba(245,242,234,.02)}.btn-ghost:hover{border-color:var(--gold);color:var(--soft)}
.btn-danger{border-color:rgba(229,115,107,.5);color:#f2a8a2}.btn-danger:hover{background:rgba(229,115,107,.1)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.link{color:var(--soft);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13.5px;margin-bottom:14px;min-height:36px}
.backbtn svg{width:16px;height:16px}.backbtn:hover{color:var(--soft)}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--soft)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:999px;text-transform:uppercase;border:1px solid}
.badge.ok{color:var(--ok);border-color:rgba(127,200,160,.4);background:rgba(127,200,160,.08)}
.badge.warn{color:var(--warn);border-color:rgba(232,183,93,.4);background:rgba(232,183,93,.08)}
.badge.bad{color:#f2a8a2;border-color:rgba(229,115,107,.45);background:rgba(229,115,107,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--gra);color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.1em;transition:all .2s}
.chip:hover{color:var(--ivory);border-color:var(--line)}
.chip.on{background:var(--gold);color:#17120a;border-color:var(--gold)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.cols{display:grid;gap:16px}
@media(min-width:860px){.cols{grid-template-columns:1.5fr 1fr;align-items:start}}
.narrow{max-width:520px;margin:0 auto}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:34px 0 14px}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid;font-size:14px;margin-bottom:14px;animation:pageIn .25s}
.alert.info{border-color:var(--line);background:rgba(201,168,106,.07);color:var(--soft)}
.alert.err{border-color:rgba(229,115,107,.5);background:rgba(229,115,107,.08);color:#f6b4af}
.alert.ok{border-color:rgba(127,200,160,.45);background:rgba(127,200,160,.08);color:#a9e0c1}
.alert.warn{border-color:rgba(232,183,93,.45);background:rgba(232,183,93,.08);color:#f0cf8e}
.empty{text-align:center;padding:40px 18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--mut)}
.empty h3{color:var(--ivory);margin-bottom:6px;font-size:18px}.empty .btn{margin-top:14px}
.note{font-size:12.5px;color:var(--mut)}
.sep{height:1px;background:var(--line2);margin:14px 0}

/* forms */
.field{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-size:13px;color:var(--mut);font-weight:500}
.input{width:100%;min-height:46px;background:var(--obs);border:1px solid var(--line2);border-radius:12px;padding:0 14px;outline:0;transition:border-color .2s,box-shadow .2s;min-width:0}
textarea.input{padding:10px 14px;min-height:90px;resize:vertical}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,106,.16)}
.input.bad{border-color:var(--danger)}.input.good{border-color:var(--ok)}
.input.sm{min-height:38px;width:auto;font-size:13.5px}
.err{color:#f2a8a2;font-size:12.5px}.err:empty{display:none}
.hint{font-size:12.5px;color:var(--mut)}.hint.ok{color:var(--ok)}.hint.bad{color:#f2a8a2}
.affix{position:relative}.affix .input{padding-right:64px}
.affix .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gold);font-weight:700;pointer-events:none}
.pw{position:relative}.pw .input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:34px;padding:0 10px;font-size:12px;color:var(--soft);border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.inline{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.search{position:relative}.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search .ic svg{width:18px;height:18px}
.search .input{padding-left:42px;padding-right:44px;border-radius:14px;background:var(--gra)}
.search .clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;color:var(--mut);display:grid;place-items:center}
.search .clear svg{width:16px;height:16px}
input[type=search]::-webkit-search-cancel-button{display:none}

/* hero */
.hero{display:grid;gap:26px;align-items:center;padding:8px 0 6px}
.hero-emblem{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:6px auto 0;order:-1}
.hero-emblem img{width:100%;height:100%;border-radius:50%;box-shadow:0 30px 60px -20px rgba(0,0,0,.9),0 0 80px -10px rgba(201,168,106,.22)}
.hero-emblem::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid transparent;border-top-color:var(--gold);border-right-color:rgba(201,168,106,.3);animation:spin 20s linear infinite}
.hero-copy{text-align:center;display:grid;gap:12px;justify-items:center}
.hero-title{font-family:var(--serif);font-size:clamp(64px,19vw,112px);line-height:.9;letter-spacing:.04em;font-weight:500}
.hero-full{letter-spacing:.55em;padding-left:.55em;font-size:12px;color:var(--gold)}
.tagline{font-size:clamp(14px,4vw,17px);letter-spacing:.32em;padding-left:.32em;color:var(--soft);font-weight:600}
@media(min-width:820px){.hero{grid-template-columns:1.2fr 1fr;padding:36px 0 10px}.hero-copy{text-align:left;justify-items:start}.hero-emblem{order:0;width:min(100%,340px)}.hero-full,.tagline{padding-left:0}}
.eco{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.eco .ico{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.eco .ico svg{width:22px;height:22px}
.eco h3{font-size:16px;margin-bottom:2px}.eco p{font-size:13.5px;color:var(--mut)}
.eco.dyxc{border-color:rgba(201,168,106,.4)}
.why{border-left:2px solid var(--gold);padding:4px 0 4px 14px}
.why h3{font-size:15.5px;margin-bottom:2px}.why p{font-size:13.5px;color:var(--mut)}
.footer{margin-top:44px;padding-top:24px;border-top:1px solid var(--line2);display:grid;gap:14px;justify-items:center;text-align:center}
.footer img{width:56px;height:56px;border-radius:50%}
.footer nav{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center}
.footer nav button{color:var(--mut);font-size:13.5px;min-height:36px}.footer nav button:hover{color:var(--soft)}

/* products */
.pcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.art{aspect-ratio:16/10;background:linear-gradient(145deg,#20202a,#121216);display:grid;place-items:center;border-bottom:1px solid var(--line2);position:relative;overflow:hidden}
.art svg{width:46px;height:46px;color:var(--gold);stroke-width:1.4}
.art img{width:100%;height:100%;object-fit:cover}
.art.big{aspect-ratio:16/9;border-radius:var(--r);border:1px solid var(--line2)}.art.big svg{width:72px;height:72px}
.art.mini{aspect-ratio:1;width:64px;border-radius:12px;border:1px solid var(--line2);flex:none}.art.mini svg{width:28px;height:28px}
.pbody{padding:14px;display:grid;gap:8px;flex:1;align-content:start}
.pbody h3{font-size:17px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.price{font-family:var(--serif);font-size:24px;color:var(--ivory)}.price.sm{font-size:18px}
.pbody .row{margin-top:auto;padding-top:6px}.pbody .row .btn{flex:1 1 110px;padding:0 10px}
.feat{display:flex;flex-wrap:wrap;gap:8px;list-style:none}
.feat li{padding:6px 12px;border:1px solid var(--line2);border-radius:999px;font-size:13px;background:var(--gra)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:40px;height:40px;display:grid;place-items:center;font-size:18px;color:var(--soft);text-align:center}
.stepper button:hover{background:rgba(201,168,106,.12)}
.stepper span{min-width:36px;text-align:center;font-weight:600}
.line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2);align-items:center}
.line:last-child{border-bottom:0}.line.pulse{animation:pulseLine .5s}
.line-main{flex:1;min-width:0;display:grid;gap:4px;font-size:14px}
.line-side{text-align:right;display:grid;gap:4px;justify-items:end}
.sum{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14.5px}
.sum.t{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:14px}
.neg{color:#f2a8a2}.pos{color:var(--ok)}

/* dyx card */
.dyx{position:relative;aspect-ratio:1.586/1;max-width:420px;width:100%;border-radius:22px;padding:18px 20px;overflow:hidden;background:linear-gradient(145deg,#20202a 0%,#0B0B0D 58%,#17171C 100%);border:1px solid rgba(201,168,106,.38);box-shadow:0 26px 50px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(241,215,155,.2);display:flex;flex-direction:column;justify-content:space-between;isolation:isolate;margin:0 auto 0 0}
.dyx::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(201,168,106,.045) 0 1px,transparent 1px 9px),radial-gradient(360px 190px at 88% -8%,rgba(241,215,155,.17),transparent 62%)}
.dyx-top{display:flex;justify-content:space-between;align-items:center}
.dyx-top img{width:46px;height:46px;border-radius:50%}
.dyx-mark{font-family:var(--serif);letter-spacing:.32em;font-weight:700;color:var(--soft);font-size:19px}
.dyx-bal{font-family:var(--serif);font-size:clamp(34px,10vw,50px);text-align:center;line-height:1}
.dyx-bal .u{font-size:.34em;margin-left:8px;letter-spacing:.22em}
.dyx-bal .count.flash{color:var(--soft)}
.dyx-bot{display:flex;justify-content:space-between;align-items:end;gap:8px}
.dyx-id{letter-spacing:.05em;color:var(--soft);font-weight:600;font-size:14px}
.dyx-note{font-size:9.5px;color:var(--mut);letter-spacing:.12em;text-align:right}

/* list items */
.item{background:var(--gra);border:1px solid var(--line2);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item-h strong{font-size:15px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;font-size:13.5px}
.meta div span{display:block;font-size:11.5px;color:var(--mut);letter-spacing:.05em}
.list{display:grid;gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.statgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--gra);border:1px solid var(--line2);border-radius:var(--r);padding:14px}
.stat span{font-size:12px;color:var(--mut);letter-spacing:.06em}.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:500;margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
@media(min-width:760px){.tabs{grid-template-columns:repeat(8,1fr)}}
.tabs button{min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--gra);font-size:12px;font-weight:600;color:var(--mut);text-align:center;padding:0 4px;transition:all .2s}
.tabs button.on{background:var(--gold);color:#17120a;border-color:var(--gold)}
.tabs button:hover:not(.on){color:var(--ivory);border-color:var(--line)}
.mtabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.preset{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.preset{grid-template-columns:repeat(4,1fr)}}
.preset button{border:1px solid var(--line2);background:var(--gra);border-radius:14px;padding:12px 8px;text-align:center;display:grid;gap:2px;transition:all .2s}
.preset button b{font-size:18px;font-family:var(--serif);font-weight:500}.preset button span{font-size:12.5px;color:var(--gold)}
.preset button:hover{border-color:var(--line)}.preset button.on{border-color:var(--gold);background:rgba(201,168,106,.1)}
.calc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-radius:14px;background:rgba(201,168,106,.07);border:1px solid var(--line);margin-bottom:14px}
.calc b{font-family:var(--serif);font-size:22px;font-weight:500}
.logohead{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:20px;text-align:center}
.logohead img{width:84px;height:84px;border-radius:50%;box-shadow:0 14px 34px -12px rgba(201,168,106,.35)}
.logohead h1{font-size:22px;letter-spacing:.16em}
.sections h2{font-size:20px;margin-bottom:6px;font-family:var(--serif);font-weight:500}
.sections .card{margin-bottom:14px;scroll-margin-top:76px}.sections p,.sections li{font-size:14.5px;color:#cfcac0}.sections ul{padding-left:18px;display:grid;gap:4px;margin-top:6px}

/* overlays */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;max-width:460px;width:100%;padding:12px 16px;border-radius:12px;background:var(--gra2);border:1px solid var(--line);box-shadow:0 14px 30px -10px rgba(0,0,0,.8);font-size:14px;animation:toastIn .3s both;display:flex;gap:10px}
.toast.err{border-color:rgba(229,115,107,.6)}.toast.ok{border-color:rgba(127,200,160,.55)}
.toast.out{animation:toastOut .25s forwards}
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(5,5,7,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:14px;animation:fadeIn .2s}
.backdrop.closing{animation:fadeOut .18s forwards}
.modal{width:100%;max-width:480px;max-height:calc(100dvh - 28px);overflow-y:auto;background:var(--gra);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 70px -20px #000;animation:modalIn .28s cubic-bezier(.2,.9,.3,1.1);outline:0}
.backdrop.closing .modal{animation:modalOut .18s forwards}
.modal h3{font-size:19px;margin-bottom:8px;font-family:var(--serif);font-weight:500}
.modal .acts{margin-top:16px;justify-content:flex-end}
#fx-root .fx{position:fixed;inset:0;z-index:150;background:rgba(8,8,10,.96);display:grid;place-items:center;padding:20px;text-align:center;animation:fadeIn .25s;overflow:hidden}
#fx-root .fx.out{animation:fadeOut .25s forwards}
.fx-in{display:grid;gap:12px;justify-items:center;max-width:420px;width:100%}
.curtain img{width:110px;height:110px;border-radius:50%;animation:pulse .6s ease-in-out infinite alternate}
.boom-core{position:relative;width:150px;height:150px;display:grid;place-items:center;margin-bottom:10px}
.boom-core img{width:110px;height:110px;border-radius:50%;animation:boomLogo .7s cubic-bezier(.2,1.6,.4,1) both;position:relative;z-index:2}
.boom-core .wave{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);animation:wave 1.4s ease-out both}
.boom-core .w2{animation-delay:.18s}.boom-core .w3{animation-delay:.36s}
.boom-core i{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--soft);animation:burst 1.2s var(--dl) cubic-bezier(.1,.8,.3,1) both}
.boom-id{font-family:var(--serif);font-size:clamp(22px,7vw,30px);color:var(--soft)}
.fx h2{font-size:clamp(28px,8vw,40px);font-family:var(--serif);font-weight:500;animation:fadeUp .6s .45s both}
.fx .boom-id,.fx .fx-in>p,.fx .fx-in>.btn{animation:fadeUp .6s .65s both}
.ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--soft);animation:ringIn .6s cubic-bezier(.2,1.4,.4,1) both}
.ring svg{width:46px;height:46px;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .35s forwards;stroke-width:2.2}
.oid{font-family:var(--serif);font-size:26px;color:var(--soft);letter-spacing:.04em}
.shake{animation:shake .4s}

/* splash */
#splash{position:fixed;inset:0;z-index:300;background:var(--obs);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{text-align:center;display:grid;justify-items:center}
.sp-logo{position:relative;width:min(46vw,180px);aspect-ratio:1;margin-bottom:26px}
.sp-logo img{width:100%;height:100%;border-radius:50%;animation:spIn .9s cubic-bezier(.2,.8,.2,1) both}
.sp-logo::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid transparent;border-top-color:var(--gold);border-right-color:rgba(201,168,106,.35);animation:spin 1.8s linear infinite}
.sp-name{font-family:var(--serif);font-size:40px;letter-spacing:.34em;padding-left:.34em;animation:fadeUp .8s .3s both}
.sp-full{letter-spacing:.55em;padding-left:.55em;font-size:12px;color:var(--gold);margin-top:6px;animation:fadeUp .8s .45s both}
.sp-tag{letter-spacing:.3em;padding-left:.3em;font-size:12px;color:var(--mut);margin-top:22px;animation:fadeUp .8s .65s both}
.sp-bar{position:absolute;left:50%;bottom:12vh;width:120px;height:2px;margin-left:-60px;background:var(--line2);overflow:hidden;border-radius:2px}
.sp-bar::after{content:"";display:block;height:100%;background:var(--gold);animation:load 1.6s ease-out both}

@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bump{40%{transform:scale(1.5)}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes pulseLine{40%{background:rgba(201,168,106,.12)}}
@keyframes spIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes load{from{width:0}to{width:100%}}
@keyframes boomLogo{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes wave{from{transform:scale(.6);opacity:.9}to{transform:scale(3.2);opacity:0}}
@keyframes burst{from{transform:translate(-50%,-50%) scale(var(--s));opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}
@keyframes ringIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="splash" role="status" aria-label="Loading GVG">
  <div class="sp-in">
    <div class="sp-logo"><img data-logo alt="GVG GENVIGUE official logo"></div>
    <div class="sp-name">GVG</div>
    <div class="sp-full">GENVIGUE</div>
    <div class="sp-tag">BUILD. CREATE. OWN.</div>
  </div>
  <div class="sp-bar"></div>
</div>

<header class="topbar" id="topbar"></header>
<main id="view" tabindex="-1"></main>

<nav class="bottomnav" aria-label="Primary">

</nav>

    persistent: ok,
    get(k, d) { try { const raw = ok ? localStorage.getItem(CONFIG.PREFIX + k) : mem[k]; return raw == null ? d : JSON.parse(raw); } catch (e) { return d; } },
    set(k, v) { const raw = JSON.stringify(v); if (ok) { try { localStorage.setItem(CONFIG.PREFIX + k, raw); return; } catch (e) { ok = false; } } mem[k] = raw; },

/* PHASE 2 — Supabase Auth. Never put a secret/service-role key in this file. */
const Auth = {
  cur() { return S.currentUser ? userById(S.currentUser) || null : null; },
  async findAsync(ident) {
    const v = String(ident || '').trim().toLowerCase();
    if (!v) return null;
    let q = sb.from('users').select('*').limit(1);
    if (/^\d{10}$/.test(v)) q = q.eq('mobile', v);
    else q = q.eq('gvg_username', v.replace(/@gvg$/, ''));
    const { data, error } = await q.maybeSingle();
    if (error || !data) return null;
    return data;
  },
  async syncUser(row) {
    if (!row) return null;
    const { data: wallet } = await sb.from('wallets').select('balance_dyx').eq('user_id', row.id).maybeSingle();
    const u = {
      id: row.id,
      name: row.full_name,
      age: row.age,
      mobile: row.mobile || '',
      state: row.state || '',
      city: row.city || '',
      username: row.gvg_username,
      balance: Number(wallet?.balance_dyx || 0),
      status: row.status,
      created: row.created_at
    };
    const i = S.users.findIndex(x => x.id === u.id);
    if (i >= 0) S.users[i] = u; else S.users.push(u);
    S.currentUser = u.id;
    DB.save('users', 'currentUser');
    return u;
  },
  async login(ident, pw) {
    if (!String(ident || '').trim() || !pw) return { ok: false, msg: 'Enter your GVG ID or mobile number and your password.' };
    const row = await Auth.findAsync(ident);
    if (!row) return { ok: false, msg: 'Invalid GVG ID/mobile or password.' };
    const { data: authData, error } = await sb.auth.signInWithPassword({ email: row.email, password: pw });
    if (error || !authData.user) return { ok: false, msg: error?.message || 'Invalid GVG ID/mobile or password.' };
    if (row.status === 'suspended') { await sb.auth.signOut(); return { ok: false, msg: 'This account is suspended. Contact GVG support.' }; }
    const u = await Auth.syncUser(row);
    return { ok: true, user: u };
  },
  async logout() {
    await sb.auth.signOut();
    S.currentUser = null; DB.save('currentUser'); UI.lastBal = undefined; UI.buyNow = null;
  }
};

function checkUsername(raw) {
  const v = String(raw || '').trim(), l = v.toLowerCase();
  if (!v) return { ok: false, state: 'idle', msg: 'Pick a username. @gvg is added for you.' };
  if (v.includes('@')) return { ok: false, state: 'bad', msg: 'Don’t type @gvg — it’s added automatically.' };
  if (/\s/.test(raw.trim())) return { ok: false, state: 'bad', msg: 'Usernames can’t contain spaces.' };
  if (!/^[a-zA-Z0-9]+$/.test(v)) return { ok: false, state: 'bad', msg: 'Use letters and numbers only.' };
  if (v.length < CONFIG.USER_MIN) return { ok: false, state: 'bad', msg: `Use at least ${CONFIG.USER_MIN} characters.` };
  if (v.length > CONFIG.USER_MAX) return { ok: false, state: 'bad', msg: `Use ${CONFIG.USER_MAX} characters or fewer.` };
  if (RESERVED.includes(l)) return { ok: false, state: 'bad', msg: 'That username is reserved.' };
  if (S.users.some(u => u.username === l)) return { ok: false, state: 'bad', msg: `${l}@gvg is already taken.` };
  return { ok: true, state: 'ok', msg: `${l}@gvg is available.` };
}

/* ============================== CART ================================ */
const Cart = {
  items() {
    const lines = S.cart.map(l => ({ ...l, p: getProduct(l.id) }));
    const valid = lines.filter(l => l.p && l.p.status === 'visible');
    if (valid.length !== S.cart.length) { S.cart = valid.map(l => ({ id: l.id, qty: l.qty })); DB.save('cart'); }
    return valid;
  },
  count() { return Cart.items().reduce((a, l) => a + l.qty, 0); },
  total(items) { return items.reduce((a, l) => a + l.p.price * l.qty, 0); },
  add(id, qty = 1) {
    const p = getProduct(id); if (!p || p.status !== 'visible') { toast('Product not found.', 'err'); return false; }
    const l = S.cart.find(x => x.id === id); if (l) l.qty = Math.min(99, l.qty + qty); else S.cart.push({ id, qty: Math.min(99, qty) });
    DB.save('cart'); updateBadge(); return true;
  },
  set(id, qty) { const l = S.cart.find(x => x.id === id); if (!l) return; if (qty < 1) return Cart.remove(id); l.qty = Math.min(99, qty); DB.save('cart'); updateBadge(); },
  remove(id) { S.cart = S.cart.filter(x => x.id !== id); DB.save('cart'); updateBadge(); },
  clear() { S.cart = []; DB.save('cart'); updateBadge(); }
};

/* Counters / animations */
function animateCount(el, from, to, dur = 850) {
  if (reduceMotion()) { el.textContent = fmt(to); return; }
  const t0 = performance.now(); el.classList.add('flash');
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(Math.round(from + (to - from) * e)); if (p < 1) requestAnimationFrame(step); else setTimeout(() => el.classList.remove('flash'), 300); };
  requestAnimationFrame(step);
}
function runCounts(root = document) { $$('.count', root).forEach(el => { const to = +el.dataset.to, from = el.dataset.from === undefined ? to : +el.dataset.from; if (from !== to) animateCount(el, from, to); else el.textContent = fmt(to); }); }

function checkoutItems() { return UI.buyNow ? [{ ...UI.buyNow, p: getProduct(UI.buyNow.id) }].filter(l => l.p && l.p.status === 'visible') : Cart.items(); }
function vCheckout() {
  if (needLogin('checkout')) return null;
  const u = Auth.cur(), items = checkoutItems();
  if (!items.length) { toast('Your cart is empty.', 'err'); return redirect('cart'); }
  const total = Cart.total(items), short = u.balance < total;
  return `${backBtn('cart')}<h1 class="h1 serif">CHECKOUT</h1>${u.status === 'suspended' ? alertBox('err', 'Your account is suspended. Orders are disabled.') : ''}${!S.settings.storeOpen ? alertBox('warn', 'The store is paused. Orders are disabled.') : ''}<div class="cols"><div class="card"><div class="lbl">Order summary</div>${items.map(l => `<div class="line">${productArt(l.p, true)}<div class="line-main"><strong>${esc(l.p.name)}</strong><span class="muted">Qty ${l.qty} × ${fmt(l.p.price)} DYX</span></div><div class="price sm">${dyxH(l.p.price * l.qty)}</div></div>`).join('')}</div>

function placeOrder() {
  const u = Auth.cur(); if (!u) { toast('Log in to place an order.', 'err'); return redirect('login'); }
  if (u.status === 'suspended') return toast('Your account is suspended.', 'err');
  if (!S.settings.storeOpen) return toast('The store is paused right now.', 'err');
  const items = checkoutItems(); if (!items.length) return toast('Your cart is empty.', 'err');
  const total = Cart.total(items); if (u.balance < total) return toast('Insufficient DYX balance.', 'err');
  const old = u.balance;
  const order = { id: nextId('order'), uid: u.id, gvgId: gvgId(u), items: items.map(l => ({ pid: l.id, name: l.p.name, price: l.p.price, qty: l.qty })), total, status: 'Pending', date: nowISO() };
  S.orders.unshift(order);
  Ledger.post(u, { type: 'PURCHASE', dyx: -total, status: 'COMPLETED', ref: order.id, note: 'Store order' });
  if (UI.buyNow) UI.buyNow = null; else Cart.clear();
  DB.save('orders', 'users', 'transactions'); UI.lastBal = u.balance; renderTopbar();
  showOrderSuccess(order, old, u.balance);
}

document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('input[type="search"], input[data-search]')) handleSearchInput(el);
  else if (el.dataset && el.dataset.live && LIVE[el.dataset.live]) LIVE[el.dataset.live](el);
  else if (el.matches && el.matches('input[type="text"]') && el.value.trim() === CONFIG.ADMIN_TRIGGER && !el.closest('form[data-form="adminLogin"]') && el.dataset.live !== 'username') { /* trigger typed in a non-search text field is ignored on purpose */ }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.change && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal-root .backdrop')) Modal.close(); else if (FX.active && FX.active !== 'boom') FX.hide(); }
  if (e.key === 'Tab') { const m = $('#modal-root .modal'); if (!m) return; const f = $$('button,input,select,textarea,[href]', m).filter(x => !x.disabled && x.type !== 'hidden'); if (!f.length) return; const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
});
window.addEventListener('hashchange', render);

/* ============================ INITIALIZATION ======================== */
async function init() {
  DB.load();
  $$('img[data-logo]').forEach(i => i.src = LOGO);
  const link = document.createElement('link'); link.rel = 'icon'; link.href = LOGO; document.head.appendChild(link);
  try {
    const { data } = await sb.auth.getSession();
    if (data.session?.user) {
      const { data: row } = await sb.from('users').select('*').eq('id', data.session.user.id).maybeSingle();
      if (row) await Auth.syncUser(row);
    } else { S.currentUser = null; DB.save('currentUser'); }
  } catch (e) { console.warn('Supabase session restore failed:', e); }
  render();
  const sp = $('#splash'), hide = () => { sp.classList.add('out'); setTimeout(() => sp.remove(), 600); };
  sp.addEventListener('click', hide); setTimeout(hide, reduceMotion() ? 300 : 1800);
}
init();
